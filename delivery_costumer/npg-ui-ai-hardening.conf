# NPG UI (npg-ui-ai) - Apache hardening
# Copy to: /etc/httpd/conf.d/npg-ui-ai-hardening.conf   (RHEL/CentOS)
#      or: /etc/apache2/conf-available/  + a2enconf     (Debian/Ubuntu)
# Requires mod_headers.
# Rollback: delete this file and reload Apache.
#
# Adjust the two paths below if the application is deployed elsewhere:
#   - the <Directory> path = the folder that contains the deployed npg-ui-ai files
#   - the <LocationMatch> = the URL base of the app and of its /api proxy

# --- Server-wide: hide version, disable TRACE (no effect on application behaviour) ---
ServerTokens Prod
ServerSignature Off
TraceEnable Off

# --- npg-ui-ai only: no directory listing, and single-page-app fallback ---
# FallbackResource makes a refresh (F5) or logout on a deep link such as /npg-ui-ai/view-processes
# return index.html instead of 404. It replaces the app's .htaccess, which Apache ignores when
# AllowOverride is None (the default on RHEL).
<Directory "/var/www/html/npg-ui-ai">
    Options -Indexes
    FallbackResource /npg-ui-ai/index.html
</Directory>

# --- npg-ui-ai and its API only: security headers ---
<LocationMatch "^/(npg-ui-ai|api)(/|$)">
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Content-Security-Policy "frame-ancestors 'self'"
</LocationMatch>
